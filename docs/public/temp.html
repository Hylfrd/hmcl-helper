<header class="wrap top" id="page-header"><h1>BNBU 横幅与背板</h1><div class="top-actions"><label class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="sr-only">搜索方案编号、照片或风格</span><input id="search" type="search" placeholder="搜索编号、照片或风格" autocomplete="off"></label></div></header>
<section class="toolbar" aria-label="方案查看方式"><div class="wrap toolbar-inner">
<div class="toolbar-head"><div class="tabs" role="tablist" aria-label="查看方式"><button class="tab" id="tab-gallery" role="tab" aria-controls="gallery-view" aria-selected="true" data-mode="gallery">全部方案 <span class="counter" id="collection-count"></span></button><button class="tab" id="tab-compare" role="tab" aria-controls="compare-view" aria-selected="false" data-mode="compare">已选对比 <span class="counter" id="compare-count">0</span></button></div><div class="toolbar-actions"><fieldset class="display-options"><legend class="sr-only">显示内容</legend><label class="display-option"><input id="show-banner" type="checkbox" checked>横幅</label><label class="display-option"><input id="show-backdrop" type="checkbox" checked>背板</label></fieldset><span class="filter-status" id="filter-status"></span><button class="filter-toggle" id="filter-toggle" aria-expanded="true" aria-controls="filter-panel"><span id="filter-toggle-label">收起筛选</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div></div>
<div class="filter-panel" id="filter-panel"><div class="controls filter-controls" id="gallery-controls"><fieldset class="choice-field backdrop-field"><legend>照片</legend><div class="choices" id="photo"></div></fieldset><fieldset class="choice-field backdrop-field"><legend>文字排版</legend><div class="choices" id="layout"></div></fieldset><fieldset class="choice-field backdrop-field"><legend>主题色</legend><div class="choices" id="theme"></div></fieldset><fieldset class="choice-field banner-versions" id="banner-versions"><legend>横幅版本</legend><div class="choices" id="variant"></div></fieldset></div>
<aside class="toolbar-side" id="gallery-sidebar" aria-label="收藏与特殊风格"><label class="fav-filter" id="favorites-filter"><input id="favorites-only" type="checkbox">只看收藏 <span id="favorite-count">0</span></label><fieldset class="choice-field special-field"><legend>特殊风格</legend><div class="choices" id="family"></div></fieldset></aside></div>
</div></section>
<main class="wrap main">
<section id="gallery-view" role="tabpanel" aria-labelledby="tab-gallery"><div class="section-line"><div><h2 id="result-title">全部方案</h2><p class="help" id="gallery-help">勾选“加入对比”，最多同时查看 4 张。</p></div><span class="status" id="result-count" aria-live="polite"></span></div><div id="gallery-grid" class="gallery"></div><div id="gallery-empty" class="empty" hidden><h2 id="empty-title">没有匹配的方案</h2><p id="empty-help">可以减少筛选条件，或返回全部方案。</p><button class="btn primary" id="empty-reset">显示全部方案</button></div></section>
<section id="compare-view" role="tabpanel" aria-labelledby="tab-compare" hidden><div class="compare-header"><div><h2 id="comparison-title">已选方案对比</h2><p class="help">点击任意一张图片放大。选择会保留在这台浏览器中。</p></div><button class="btn" id="clear-compare">清空对比</button></div><div id="comparison-grid" class="compare-grid"></div><div id="compare-empty" class="empty"><h2>还没有加入对比的方案</h2><p>从全部方案中勾选几张，就能在这里并排查看。</p><button class="btn primary" id="back-to-gallery">挑选方案</button></div></section>
<footer class="footer">背板按底部照片分组编号，特殊风格列于最后。横幅与背板按实际尺寸比例展示，点击任意图片可放大。</footer>
</main>

for(const [key,values] of Object.entries({family:payload.families,photo:payload.photos,layout:payload.layouts,theme:payload.themes,variant:payload.bannerVariants||[]}))fillChoices(key,values);
function filteredBanners(){const q=state.search.trim().toLowerCase();return banners.filter(d=>(!state.variant.length||state.variant.includes(d.variant))&&(!q||`${d.title} ${d.themeLabel} ${d.variantLabel} ${d.theme}`.toLowerCase().includes(q)));}
function matchingBanner(d){const candidates=banners.filter(b=>b.theme.toUpperCase()===d.theme.toUpperCase()&&(!state.variant.length||state.variant.includes(b.variant)));if(!candidates.length)return null;const key=JSON.stringify([pairSeed,d.id,state.variant,state.family,state.photo,state.layout,state.theme,state.search]);let hash=2166136261;for(let i=0;i<key.length;i++)hash=Math.imul(hash^key.charCodeAt(i),16777619);return candidates[(hash>>>0)%candidates.length];}
function filtered(){const q=state.search.trim().toLowerCase(),numeric=/^[0-9]+$/.test(q),ordinary=state.photo.length||state.layout.length;return designs.filter(d=>(!ordinary||!specialFamilies.has(d.family))&&['family','photo','layout','theme'].every(key=>!state[key].length||state[key].includes(d[key]))&&(!state.onlyFavorites||state.favorites.includes(d.id))&&(!q||(numeric?d.id===Number(q):`${d.title} ${d.photoLabel} ${d.layoutLabel} ${d.family} ${d.themeLabel} ${d.theme}`.toLowerCase().includes(q))));}
function bannerImage(b,context='gallery'){return `<button class="image-button banner-image" data-open-banner="${esc(b.id)}" data-context="${context}" aria-label="放大横幅：${esc(b.title)}，${esc(b.themeLabel)}"><img src="${esc(b.preview)}" alt="横幅：${esc(b.variantLabel)}，${esc(b.themeLabel)}" width="1465" height="150" loading="lazy" decoding="async"></button>`;}
function card(d,context='gallery'){const selected=state.selected.includes(d.id),favorite=state.favorites.includes(d.id),b=state.showBanner?matchingBanner(d):null;return `<article class="card${selected?' selected':''}" data-card="${d.id}"><div class="stage-pair">${state.showBanner?(b?bannerImage(b,context):'<div class="banner-missing">暂无同色横幅</div>'):''}<button class="image-button" data-open="${d.id}" data-context="${context}" aria-label="放大查看 ${number(d.id)} 号背板，${esc(d.title)}"><img src="${esc(d.thumb)}" alt="${number(d.id)} 号背板：${esc(d.title)}，${esc(d.themeLabel)}" width="586" height="500" loading="lazy" decoding="async"></button></div><h3 class="card-title"><span class="number">${number(d.id)}</span><span class="title-text">${esc(d.title)}</span></h3><div class="card-meta"><span class="swatch" style="background:${esc(d.theme)}"></span>${esc(d.themeLabel)} <span>${esc(d.theme)}</span></div>${b?`<div class="pair-caption">横幅 · ${esc(b.variantLabel)}</div>`:''}<div class="card-footer"><label class="pick"><input type="checkbox" data-compare="${d.id}" ${selected?'checked':''}>${context==='compare'?'保留对比':'加入对比'}</label><div class="card-tools"><button class="icon-btn" data-favorite="${d.id}" aria-label="${favorite?'取消收藏':'收藏'} ${number(d.id)} 号" aria-pressed="${favorite}">${star}</button><a class="icon-btn full-link" href="${esc(d.full)}" download="BNBU-${number(d.id)}.${d.extension||'png'}" target="_blank" rel="noopener" aria-label="保存 ${number(d.id)} 号背板高清图片">${arrow}</a></div></div></article>`;}
function bannerCard(b){return `<article class="card banner-card">${bannerImage(b)}<h3 class="card-title"><span class="number">横幅</span><span>${esc(b.variantLabel)} · ${esc(b.themeLabel)}</span></h3><div class="card-meta"><span class="swatch" style="background:${esc(b.theme)}"></span>${esc(b.theme)} · 2.93 × 0.30 m</div><div class="card-footer"><a class="icon-btn banner-download" href="${esc(b.svg)}" download="BNBU-${esc(b.id)}.svg" aria-label="下载 ${esc(b.title)} 的 SVG">SVG</a><a class="icon-btn banner-download" href="${esc(b.full)}" download="BNBU-${esc(b.id)}.png" aria-label="下载 ${esc(b.title)} 的高清 PNG">PNG</a></div></article>`;}
function renderGallery(){const list=state.showBackdrop?filtered():state.showBanner?filteredBanners():[],bannerOnly=state.showBanner&&!state.showBackdrop;$('gallery-grid').classList.toggle('banner-gallery',bannerOnly);$('gallery-grid').innerHTML=list.map(d=>bannerOnly?bannerCard(d):card(d)).join('');$('gallery-empty').hidden=list.length>0;$('result-count').textContent=state.showBackdrop?`${list.length} / ${designs.length} 个背板`:state.showBanner?`${list.length} / ${banners.length} 个横幅`:'';$('result-title').textContent=bannerOnly?'横幅方案':state.showBackdrop?(state.onlyFavorites?'我的收藏':state.family.length?state.family.join('、'):state.showBanner?'横幅与背板搭配':'背板方案'):'选择展示内容';$('gallery-help').textContent=bannerOnly?'按颜色与版本顺序展示；横幅不使用颜色筛选。':state.showBackdrop?(state.showBanner?'自动搭配同色横幅；同组可多选，不勾选表示全部。':'同组可多选，不勾选表示全部。'):'在上方勾选横幅或背板。';$('empty-title').textContent=state.showBanner||state.showBackdrop?'没有匹配的方案':'尚未选择展示内容';$('empty-help').textContent=state.showBanner||state.showBackdrop?'减少筛选条件，或显示全部方案。':'在上方开启“横幅”或“背板”后即可查看。';$('empty-reset').hidden=!state.showBanner&&!state.showBackdrop;$('collection-count').textContent=state.showBackdrop?designs.length:state.showBanner?banners.length:0;}
function renderCompare(){const list=state.selected.map(id=>byId.get(id));$('comparison-grid').classList.toggle('single',list.length===1);$('comparison-grid').innerHTML=list.map(d=>card(d,'compare')).join('');$('compare-empty').hidden=list.length>0;$('clear-compare').hidden=list.length===0;$('comparison-title').textContent=`已选方案对比${list.length?' · '+list.length+' 张':''}`;}
function updateSelectionUI(){document.querySelectorAll('[data-compare]').forEach(el=>el.checked=state.selected.includes(Number(el.dataset.compare)));document.querySelectorAll('[data-card]').forEach(el=>el.classList.toggle('selected',state.selected.includes(Number(el.dataset.card))));document.querySelectorAll('[data-favorite]').forEach(el=>{const id=Number(el.dataset.favorite),active=state.favorites.includes(id);el.setAttribute('aria-pressed',String(active));el.setAttribute('aria-label',`${active?'取消收藏':'收藏'} ${number(id)} 号`);});$('compare-count').textContent=state.selected.length;$('favorite-count').textContent=state.favorites.length;
 const show=state.selected.length>0&&state.mode!=='compare'&&state.showBackdrop;$('compare-tray').hidden=!show;document.body.classList.toggle('has-tray',show);$('tray-items').innerHTML=state.selected.map(id=>{const d=byId.get(id);return `<div class="tray-item"><img src="${esc(d.thumb)}" alt=""><span>${number(id)}</span><button class="icon-btn" data-remove="${id}" aria-label="移除 ${number(id)} 号对比">${closeIcon}</button></div>`;}).join('');$('open-compare').textContent=`查看对比（${state.selected.length}）`;}
function updateFilterPanel(){if(filterIntent===null&&window.scrollY>$('page-header').offsetHeight+12)autoCollapsed=true;const available=state.mode==='gallery'&&(state.showBackdrop||state.showBanner),expanded=available&&(filterIntent===null?!autoCollapsed:filterIntent);$('filter-panel').hidden=!expanded;document.querySelector('.toolbar').classList.toggle('is-collapsed',!expanded);$('filter-toggle').hidden=!available;$('filter-toggle').setAttribute('aria-expanded',String(expanded));$('filter-toggle-label').textContent=expanded?'收起筛选':'展开筛选';$('filter-status').textContent=state.showBackdrop?(state.showBanner?'横幅自动匹配背板颜色':'仅背板'):state.showBanner?'仅横幅':'';}
function updateControls(){const gallery=state.mode==='gallery';document.querySelectorAll('.backdrop-field').forEach(el=>el.hidden=!state.showBackdrop);$('gallery-sidebar').hidden=!gallery||!state.showBackdrop;$('banner-versions').hidden=!state.showBanner;$('filter-panel').classList.toggle('banners-only',!state.showBackdrop);$('tab-compare').hidden=!state.showBackdrop;$('search').disabled=!gallery;$('search').placeholder=gallery?(state.showBackdrop?'搜索编号、照片或风格':'搜索横幅颜色或版本'):'在“全部方案”中搜索';updateFilterPanel();}
function setMode(mode){state.mode=state.showBackdrop?mode:'gallery';document.querySelectorAll('[data-mode]').forEach(el=>{const active=el.dataset.mode===state.mode;el.setAttribute('aria-selected',String(active));el.tabIndex=active?0:-1;});['gallery','compare'].forEach(m=>$(m+'-view').hidden=m!==state.mode);updateControls();if(state.mode==='gallery')renderGallery();if(state.mode==='compare')renderCompare();updateSelectionUI();}
function toggleCompare(id){if(state.selected.includes(id))state.selected=state.selected.filter(n=>n!==id);else{if(state.selected.length>=4){notify('最多同时对比 4 张，请先移除一张。');updateSelectionUI();return;}state.selected.push(id);}save();if(state.mode==='compare')renderCompare();updateSelectionUI();}
function toggleFavorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(n=>n!==id):[...state.favorites,id];save();if(state.mode==='gallery'&&state.onlyFavorites)renderGallery();updateSelectionUI();}
function clearCompare(){state.selected=[];save();if(state.mode==='compare')renderCompare();updateSelectionUI();}
function clearFilter(key){state[key]=[];$(key).querySelectorAll('input').forEach(input=>input.checked=false);}
function resetFilters(){for(const key of ['family','photo','layout','theme','variant'])clearFilter(key);state.search='';$('search').value='';state.onlyFavorites=false;$('favorites-only').checked=false;setMode('gallery');}
let imageViewer=null;
function openViewer(id,context,kind='backdrop'){
 if(typeof Viewer!=='function'){notify('图片查看器未能加载，请刷新页面重试。');return;}
 if(imageViewer)imageViewer.hide(true);
 const backdrops=context==='compare'?state.selected.map(n=>byId.get(n)):filtered();
 const list=kind==='banner'?(state.showBackdrop?[...new Map(backdrops.map(matchingBanner).filter(Boolean).map(b=>[b.id,b])).values()]:filteredBanners()):backdrops,opener=document.activeElement;
 if(!list.length)return;
 const source=document.createElement('div');source.className='sr-only';source.setAttribute('aria-hidden','true');
 source.innerHTML=list.map(d=>`<img src="${esc(d.preview)}" data-full="${esc(d.full)}" alt="${kind==='banner'?'横幅':number(d.id)+' 号背板'} · ${esc(d.title)} · ${esc(d.themeLabel)}">`).join('');document.body.append(source);
 const instance=new Viewer(source,{inline:false,url:'data-full',transition:!matchMedia('(prefers-reduced-motion: reduce)').matches,
  toolbar:{zoomIn:1,zoomOut:1,oneToOne:1,reset:1,rotateLeft:1,rotateRight:1},
  title:(image,imageData)=>`${image.alt} · ${imageData.naturalWidth} × ${imageData.naturalHeight}`,
  hidden(){instance.destroy();if(imageViewer===instance)imageViewer=null;source.remove();if(opener?.isConnected)opener.focus();}
 });imageViewer=instance;instance.view(list.findIndex(d=>d.id===id));
}
document.addEventListener('click',event=>{const target=event.target.closest('button,a');if(!target)return;if(target.dataset.mode){setMode(target.dataset.mode);return;}if(target.dataset.openBanner){openViewer(target.dataset.openBanner,target.dataset.context,'banner');return;}if(target.dataset.open){openViewer(Number(target.dataset.open),target.dataset.context);return;}if(target.dataset.favorite){toggleFavorite(Number(target.dataset.favorite));return;}if(target.dataset.remove){toggleCompare(Number(target.dataset.remove));return;}});
document.addEventListener('change',event=>{if(event.target.dataset.compare)toggleCompare(Number(event.target.dataset.compare));});
for(const key of ['family','photo','layout','theme','variant'])$(key).addEventListener('change',()=>{state[key]=Array.from($(key).querySelectorAll('input:checked'),input=>input.value);if(state[key].length){if(key==='family'){clearFilter('photo');clearFilter('layout');}else if(key==='photo'||key==='layout')clearFilter('family');}renderGallery();updateSelectionUI();});
$('search').addEventListener('input',()=>{state.search=$('search').value;renderGallery();updateSelectionUI();});$('favorites-only').addEventListener('change',()=>{state.onlyFavorites=$('favorites-only').checked;renderGallery();updateSelectionUI();});
$('empty-reset').addEventListener('click',resetFilters);$('back-to-gallery').addEventListener('click',()=>setMode('gallery'));['clear-compare','tray-clear'].forEach(id=>$(id).addEventListener('click',clearCompare));$('open-compare').addEventListener('click',()=>{setMode('compare');window.scrollTo({top:0,behavior:'auto'});});
for(const [id,key] of [['show-banner','showBanner'],['show-backdrop','showBackdrop']])$(id).addEventListener('change',()=>{state[key]=$(id).checked;setMode(state.mode);});
$('filter-toggle').addEventListener('click',()=>{filterIntent=$('filter-toggle').getAttribute('aria-expanded')!=='true';updateFilterPanel();});
window.addEventListener('scroll',updateFilterPanel,{passive:true});window.addEventListener('resize',updateFilterPanel);
document.addEventListener('keydown',event=>{if(imageViewer)return;if(event.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const modes=state.showBackdrop?['gallery','compare']:['gallery'];let i=modes.indexOf(state.mode);i=event.key==='Home'?0:event.key==='End'?modes.length-1:(i+1)%modes.length;setMode(modes[i]);$('tab-'+modes[i]).focus();}});
document.addEventListener('error',event=>{const img=event.target;if(img.tagName==='IMG'&&img.closest('.image-button')){const parent=img.parentElement;if(!parent.querySelector('.image-error')){const message=document.createElement('span');message.className='image-error';message.textContent='缩略图未能加载，点击查看高清图片';parent.append(message);}img.style.visibility='hidden';}},true);
setMode('gallery');
</script>
</body>
</html>
